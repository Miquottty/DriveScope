<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline Replay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#0B0D10;color:#E8ECF0}
a{color:#F2A33A;text-decoration:none}a:hover{color:#FFC067}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D10; display: flex; flex-direction: column; position: relative">

  <div style="height: 380px; background: #10151B; position: relative; overflow: hidden">
    <svg width="390" height="380" viewBox="0 0 390 380" fill="none" aria-label="Replay map">
      <path d="M0 60H390M0 140H390M0 220H390M0 300H390M60 0V380M160 0V380M260 0V380M360 0V380" stroke="#161C23" stroke-width="1"></path>
      <path d="M40 330 C90 280, 150 290, 190 250 S260 150, 330 110" stroke="#2A323B" stroke-width="7" stroke-linecap="round"></path>
      <path d="M40 330 C90 280, 150 290, 190 250" stroke="#F2A33A" stroke-width="4" stroke-linecap="round"></path>
      <path d="M190 250 S260 150, 330 110" stroke="#F2A33A" stroke-width="4" stroke-linecap="round" opacity="0.28"></path>
      <circle cx="40" cy="330" r="6" fill="#0B0D10" stroke="#7BD88F" stroke-width="3"></circle>
      <g transform="translate(190 250) rotate(-40)"><path d="M0 -14 L9 10 L0 5 L-9 10 Z" fill="#E8ECF0" stroke="#0B0D10" stroke-width="2"></path></g>
    </svg>
    <a href="Detail.dc.html" aria-label="Back" style="position: absolute; top: 56px; left: 16px; width: 44px; height: 44px; border-radius: 22px; background: #0B0D10; display: flex; align-items: center; justify-content: center; opacity: 0.92">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8ECF0" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="position: absolute; top: 62px; right: 16px; display: flex; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #0B0D10; background: #E8ECF0; border-radius: 6px; padding: 5px 8px">FOLLOW</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #B4BEC8; background: #0B0D10; border-radius: 6px; padding: 5px 8px; opacity: 0.92">3D</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 16px 20px 0 20px; gap: 14px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="mono" style="font-size: 64px; font-weight: 500; line-height: 1; letter-spacing: -0.03em">82</span>
        <span style="font-size: 14px; color: #8A94A0">km/h</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px">
        <div style="display: flex; flex-direction: column"><span style="font-size: 10px; letter-spacing: 0.1em; color: #8A94A0">ALT</span><span class="mono" style="font-size: 17px; font-weight: 500">711 m</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-size: 10px; letter-spacing: 0.1em; color: #8A94A0">CRS</span><span class="mono" style="font-size: 17px; font-weight: 500">281°</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-size: 10px; letter-spacing: 0.1em; color: #8A94A0">LAT G</span><span class="mono" style="font-size: 17px; font-weight: 500; color: #F2A33A">+0.18</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-size: 10px; letter-spacing: 0.1em; color: #8A94A0">LONG G</span><span class="mono" style="font-size: 17px; font-weight: 500">−0.07</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <svg width="350" height="44" viewBox="0 0 350 44" fill="none" aria-label="Speed profile">
        <path d="M0 40 L20 30 L40 34 L60 18 L80 22 L100 10 L120 14 L140 24 L160 12 L180 8 L200 16 L220 28 L240 20 L260 26 L280 12 L300 18 L320 30 L350 24 V44 H0 Z" fill="#F2A33A" opacity="0.14"></path>
        <path d="M0 40 L20 30 L40 34 L60 18 L80 22 L100 10 L120 14 L140 24 L160 12 L180 8 L200 16 L220 28 L240 20 L260 26 L280 12 L300 18 L320 30 L350 24" stroke="#F2A33A" stroke-width="1.5"></path>
        <path d="M152 0V44" stroke="#E8ECF0" stroke-width="2"></path>
        <path d="M6 0V44" stroke="#7BD88F" stroke-width="1.5" stroke-dasharray="2 2"></path>
        <path d="M104 0V44" stroke="#E8ECF0" stroke-width="1.5" stroke-dasharray="2 2"></path>
      </svg>
      <div style="height: 28px; position: relative; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #2A323B"></div>
        <div style="position: absolute; left: 0; width: 152px; height: 4px; border-radius: 2px; background: #F2A33A"></div>
        <input type="range" min="0" max="2551" value="1104" aria-label="Timeline" style="position: absolute; left: 0; right: 0; width: 350px; opacity: 0; height: 28px; margin: 0">
        <div style="position: absolute; left: 140px; width: 24px; height: 24px; border-radius: 12px; background: #E8ECF0; box-shadow: 0 2px 8px rgba(0,0,0,0.5)"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span class="mono" style="font-size: 12px; color: #8A94A0">00:00</span>
        <span class="mono" style="font-size: 16px; font-weight: 500">18:24.5</span>
        <span class="mono" style="font-size: 12px; color: #8A94A0">42:31</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; gap: 6px">
        <span class="mono" style="font-size: 11px; color: #7BD88F; background: #14181D; border-radius: 6px; padding: 5px 8px">SYNC 00:00:12</span>
        <span class="mono" style="font-size: 11px; color: #E8ECF0; background: #14181D; border-radius: 6px; padding: 5px 8px">MARK 12:42</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="Step back" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #14181D; color: #E8ECF0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"></path></svg></button>
        <button type="button" aria-label="Play" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #F2A33A; color: #0B0D10; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"></path></svg></button>
        <button type="button" class="mono" style="height: 44px; min-width: 44px; padding: 0 10px; border-radius: 22px; border: none; background: #14181D; color: #E8ECF0; font-size: 13px; font-weight: 500">1×</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
