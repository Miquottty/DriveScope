<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording HUD · landscape v2 · Pro Max</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#000000;color:#E8ECF0}
a{color:#F2A33A;text-decoration:none}a:hover{color:#FFC067}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 956px; height: 440px; box-sizing: border-box; background: #000000; display: flex; flex-direction: column; padding: 10px 62px 20px 62px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 14px; height: 14px; border-radius: 7px; background: #E5484D; box-shadow: 0 0 12px #E5484D"></span>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: 0.1em; color: #E5484D">REC</span>
      <span class="mono" style="font-size: 34px; font-weight: 500; line-height: 1.15; margin-left: 4px">00:24:38</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span class="mono" style="font-size: 13px; color: #8A94A0">50 Hz · Logger</span>
      <div style="display: flex; align-items: center; gap: 7px; background: #14181D; border-radius: 10px; padding: 7px 11px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7BD88F" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
        <span class="mono" style="font-size: 15px; font-weight: 500; color: #7BD88F">±3 m</span>
      </div>
    </div>
  </div>

  <div style="margin-top: 8px; padding: 10px 2px; border-top: 1px solid #1F252C; border-bottom: 1px solid #1F252C; display: flex; align-items: baseline; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">ALT</span>
      <span class="mono" style="font-size: 24px; font-weight: 500">684<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">m</span></span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">COURSE</span>
      <span class="mono" style="font-size: 24px; font-weight: 500">276<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">° W</span></span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">DIST</span>
      <span class="mono" style="font-size: 24px; font-weight: 500">18.4<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">km</span></span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 12px; align-items: center">
    <div style="grid-column: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <span class="mono" style="font-size: 220px; font-weight: 500; line-height: 0.82; letter-spacing: -0.04em">72</span>
      <div style="margin-top: 10px; display: flex; align-items: baseline; gap: 12px">
        <span style="font-size: 22px; font-weight: 500; color: #8A94A0">km/h</span>
        <span style="font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">GPS SPEED</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 20px">
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <div style="font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">LATERAL</div>
          <div class="mono" style="font-size: 40px; font-weight: 500; line-height: 1.1; color: #F2A33A">+0.21<span style="font-size: 16px; color: #8A94A0; margin-left: 4px">G</span></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <div style="font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">LONG</div>
          <div class="mono" style="font-size: 40px; font-weight: 500; line-height: 1.1; color: #E8ECF0">−0.08<span style="font-size: 16px; color: #8A94A0; margin-left: 4px">G</span></div>
        </div>
        <button type="button" style="display: flex; align-items: center; gap: 6px; border: 1px solid #2A323B; background: transparent; color: #8A94A0; border-radius: 999px; padding: 5px 10px; font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 12px; font-weight: 500"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>CAL · 90°</button>
      </div>
      <svg width="232" height="232" viewBox="0 0 232 232" fill="none" aria-label="G-force meter" style="flex-shrink: 0">
        <circle cx="116.0" cy="116.0" r="112.0" stroke="#2A323B" stroke-width="2"></circle>
        <circle cx="116.0" cy="116.0" r="74.7" stroke="#1F252C" stroke-width="1.5"></circle>
        <circle cx="116.0" cy="116.0" r="37.3" stroke="#1F252C" stroke-width="1.5"></circle>
        <path d="M116.0 4.0V228.0M4.0 116.0H228.0" stroke="#1F252C" stroke-width="1.5"></path>
        <path d="M116.0 116.0 L111.5 117.1 L103.7 120.5 L97.0 122.7 L92.5 125.0 Z" fill="#F2A33A" opacity="0.16"></path>
        <text x="116.0" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#8A94A0">1.0 G</text>
        <circle cx="92.5" cy="125.0" r="10" fill="#F2A33A"></circle>
      </svg>
    </div>
  </div>

  <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 12px">
    <button type="button" style="height: 56px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v18M6 4h11l-2 4 2 4H6"></path></svg>MARK
    </button>
    <button type="button" style="height: 56px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3 4 14h7l-1 7 9-11h-7z"></path></svg>SYNC
    </button>
    <a href="Detail.dc.html" style="height: 56px; border-radius: 14px; background: #E5484D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: 0.12em">
      <span style="width: 14px; height: 14px; border-radius: 3px; background: #FFFFFF"></span>STOP
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":956,"height":440}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
