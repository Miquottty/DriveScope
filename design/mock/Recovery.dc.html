<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crash Recovery Sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#0B0D10;color:#E8ECF0}
a{color:#F2A33A;text-decoration:none}a:hover{color:#FFC067}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 200px; box-sizing: border-box; background: #0B0D10; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px">
  <div style="font-size: 10px; letter-spacing: 0.1em; color: #5C6670">ON LAUNCH · UNFINISHED SESSION FOUND</div>
  <div style="border-radius: 18px; background: #14181D; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #3A2A10">
    <div style="display: flex; align-items: flex-start; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2A33A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 600">Previous recording didn't finish</div>
        <div class="mono" style="font-size: 12px; color: #B4BEC8">Sep 25 19:05 · 2:14:50 recovered · 188.3 km · last flush 3 s before exit</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 44px; border-radius: 12px; border: none; background: #F2A33A; color: #0B0D10; font-family: inherit; font-size: 14px; font-weight: 600">Recover session</button>
      <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; font-family: inherit; font-size: 14px; font-weight: 600">Discard</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
