<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#000000;color:#E8ECF0}
a{color:#F2A33A;text-decoration:none}a:hover{color:#FFC067}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; display: flex; flex-direction: column; padding: 62px 20px 34px 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #E5484D; box-shadow: 0 0 10px #E5484D"></span>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: #E5484D">REC</span>
      <span class="mono" style="font-size: 20px; font-weight: 500; margin-left: 6px">00:24:38</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; background: #14181D; border-radius: 8px; padding: 5px 9px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7BD88F" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
      <span class="mono" style="font-size: 13px; font-weight: 500; color: #7BD88F">±3 m</span>
    </div>
  </div>

  <div style="margin-top: 36px; display: flex; flex-direction: column; align-items: center">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span class="mono" style="font-size: 132px; font-weight: 500; line-height: 1; letter-spacing: -0.04em">72</span>
      <span style="font-size: 20px; font-weight: 500; color: #8A94A0">km/h</span>
    </div>
    <div style="margin-top: 6px; font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">GPS SPEED</div>
  </div>

  <div style="margin-top: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
      <div style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">ALT</div>
      <div class="mono" style="font-size: 26px; font-weight: 500">684<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">m</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
      <div style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">COURSE</div>
      <div class="mono" style="font-size: 26px; font-weight: 500">276<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">° W</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
      <div style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">DIST</div>
      <div class="mono" style="font-size: 26px; font-weight: 500">18.4<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">km</span></div>
    </div>
  </div>

  <div style="margin-top: 28px; display: flex; align-items: center; justify-content: center; gap: 28px">
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px">
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">LATERAL</div>
        <div class="mono" style="font-size: 28px; font-weight: 500; color: #F2A33A">+0.21<span style="font-size: 12px; color: #8A94A0; margin-left: 3px">G</span></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">LONG</div>
        <div class="mono" style="font-size: 28px; font-weight: 500">−0.08<span style="font-size: 12px; color: #8A94A0; margin-left: 3px">G</span></div>
      </div>
    </div>
    <svg width="150" height="150" viewBox="0 0 150 150" fill="none" aria-label="G-force meter">
      <circle cx="75" cy="75" r="72" stroke="#1F252C" stroke-width="1.5"></circle>
      <circle cx="75" cy="75" r="48" stroke="#1F252C" stroke-width="1"></circle>
      <circle cx="75" cy="75" r="24" stroke="#1F252C" stroke-width="1"></circle>
      <path d="M75 3v144M3 75h144" stroke="#1F252C" stroke-width="1"></path>
      <path d="M90 75 L75 48 L75 75 Z" fill="#F2A33A" opacity="0.18"></path>
      <circle cx="105" cy="87" r="7" fill="#F2A33A"></circle>
      <text x="75" y="14" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8A94A0">1.0</text>
    </svg>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" style="height: 64px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v18M6 4h11l-2 4 2 4H6"></path></svg>MARK
    </button>
    <button type="button" style="height: 64px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3 4 14h7l-1 7 9-11h-7z"></path></svg>SYNC
    </button>
  </div>
  <div style="margin-top: 6px; font-size: 11px; color: #5C6670; text-align: center">MARK = bookmark this moment · SYNC = clap / flash for camera sync</div>

  <a href="Detail.dc.html" style="margin-top: 16px; height: 68px; border-radius: 16px; background: #E5484D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: 0.12em">
    <span style="width: 16px; height: 16px; border-radius: 3px; background: #FFFFFF"></span>STOP
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
