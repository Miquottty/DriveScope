<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording HUD · portrait v2 · start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#000000;color:#E8ECF0}
a{color:#F2A33A;text-decoration:none}a:hover{color:#FFC067}
.mono{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; display: flex; flex-direction: column; padding: 62px 20px 34px 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 14px; height: 14px; border-radius: 7px; background: #E5484D; box-shadow: 0 0 12px #E5484D"></span>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: 0.1em; color: #E5484D">REC</span>
      <span class="mono" style="font-size: 34px; font-weight: 500; line-height: 1.15; margin-left: 4px">00:00:03</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; background: #14181D; border-radius: 10px; padding: 7px 11px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2A33A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
      <span class="mono" style="font-size: 15px; font-weight: 500; color: #F2A33A">ACQUIRING</span>
    </div>
  </div>

  <div style="margin-top: 18px; display: flex; flex-direction: column; align-items: center">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span class="mono" style="font-size: 160px; font-weight: 500; line-height: 0.82; letter-spacing: -0.04em">--</span>
      <span style="font-size: 22px; font-weight: 500; color: #8A94A0">km/h</span>
    </div>
    <div style="margin-top: 10px; font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">GPS SPEED</div>
  </div>

  <div style="margin-top: 22px; padding: 10px 2px; border-top: 1px solid #1F252C; border-bottom: 1px solid #1F252C; display: flex; align-items: baseline; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">ALT</span>
        <span class="mono" style="font-size: 24px; font-weight: 500">32<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">m</span></span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">COURSE</span>
        <span class="mono" style="font-size: 24px; font-weight: 500">--<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">°</span></span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 11px; letter-spacing: 0.1em; color: #8A94A0">DIST</span>
        <span class="mono" style="font-size: 24px; font-weight: 500">0.0<span style="font-size: 13px; color: #8A94A0; margin-left: 3px">km</span></span>
      </div>
  </div>

  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">LATERAL</div>
        <div class="mono" style="font-size: 40px; font-weight: 500; line-height: 1.1; color: #F2A33A">+0.00<span style="font-size: 16px; color: #8A94A0; margin-left: 4px">G</span></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="font-size: 12px; letter-spacing: 0.1em; color: #8A94A0">LONG</div>
        <div class="mono" style="font-size: 40px; font-weight: 500; line-height: 1.1; color: #E8ECF0">+0.00<span style="font-size: 16px; color: #8A94A0; margin-left: 4px">G</span></div>
      </div>
  </div>

  <div style="position: relative; width: 100%; flex-grow: 1; min-height: 120px; display: flex; align-items: center; justify-content: center">
      <svg width="196" height="196" viewBox="0 0 196 196" fill="none" aria-label="G-force meter">
        <circle cx="98.0" cy="98.0" r="94.0" stroke="#2A323B" stroke-width="2"></circle>
        <circle cx="98.0" cy="98.0" r="62.7" stroke="#1F252C" stroke-width="1.5"></circle>
        <circle cx="98.0" cy="98.0" r="31.3" stroke="#1F252C" stroke-width="1.5"></circle>
        <path d="M98.0 4.0V192.0M4.0 98.0H192.0" stroke="#1F252C" stroke-width="1.5"></path>
        
        <text x="98.0" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#8A94A0">1.0 G</text>
        <circle cx="98.0" cy="98.0" r="10" fill="#F2A33A"></circle>
      </svg>
      <div style="position: absolute; right: 0; bottom: 4px"><span class="mono" style="font-size: 12px; font-weight: 500; color: #5C6670">GPS EST.</span></div>
    </div>

  <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <button type="button" style="height: 64px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v18M6 4h11l-2 4 2 4H6"></path></svg>MARK
    </button>
    <button type="button" style="height: 64px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>HIGHLIGHT
    </button>
    <button type="button" style="height: 64px; border: 1.5px solid #2A323B; background: #0F1215; color: #E8ECF0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3 4 14h7l-1 7 9-11h-7z"></path></svg>SYNC
    </button>
  </div>
  <div style="margin-top: 6px; font-size: 9.5px; color: #5C6670; text-align: center; white-space: nowrap">MARK = bookmark · HIGHLIGHT = best moment · SYNC = beep for camera sync</div>

  <a href="Detail.dc.html" style="margin-top: 16px; height: 68px; flex-shrink: 0; border-radius: 16px; background: #E5484D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: 0.12em">
    <span style="width: 16px; height: 16px; border-radius: 3px; background: #FFFFFF"></span>STOP
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
